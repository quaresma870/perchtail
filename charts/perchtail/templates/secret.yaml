{{- if and .Values.credentialEncryptionKey.value (not .Values.credentialEncryptionKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "perchtail.keySecretName" . }}
  labels:
    {{- include "perchtail.labels" . | nindent 4 }}
  annotations:
    # Kept by `helm uninstall`, with the data it decrypts.
    helm.sh/resource-policy: keep
type: Opaque
data:
  credential-encryption-key: {{ .Values.credentialEncryptionKey.value | b64enc | quote }}
{{- end }}
