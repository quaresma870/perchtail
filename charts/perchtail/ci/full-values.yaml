# Every optional part turned on, for `helm template | kubeconform` in CI.
credentialEncryptionKey:
  value: not-a-real-key-only-for-rendering-the-templates
database:
  existingSecret: perchtail-db
image:
  digest: sha256:1cbee9306b308bdcbfb1cd4a5e2caa6dee3da74663f17228b0eae6a34ed74bf2
  pullSecrets:
    - name: mirror
env:
  PUBLIC_BASE_URL: https://perchtail.example.com
  TRUSTED_PROXIES: 10.244.0.0/16
extraEnv:
  - name: LOG_LEVEL
    value: DEBUG
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  tls:
    - secretName: perchtail-tls
      hosts:
        - perchtail.example.com
networkPolicy:
  enabled: true
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - port: 22
persistence:
  storageClass: local-ssd
