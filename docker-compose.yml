services:
  perchtail:
    build: .
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_SECONDS (20 s), so running background jobs
    # can finish on a stop (docs/high-availability.md).
    stop_grace_period: 30s
    ports:
      - "8080:8000"
    env_file:
      - .env
    volumes:
      - perchtail-data:/data
      # Recommended in production: the database, the scratch space and the
      # logs on separate volumes (ideally separate disks), so a burst of
      # downloads filling scratch, or of DEBUG logging, can't fill the
      # database's disk. Mount them over the default directories:
      # - perchtail-db:/data/db
      # - perchtail-scratch:/data/scratch
      # - perchtail-logs:/data/logs

volumes:
  perchtail-data:
  # perchtail-db:
  # perchtail-scratch:
  # perchtail-logs:
