version: 2
updates:
  # Backend (backend/requirements.in -> requirements.txt pins, requirements-dev.txt)
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - backend
    ignore:
      # Capped in requirements.in: 0.0.45+ rejects naive datetimes, which
      # app/timeutils.py stores on purpose. Lift together with that cap.
      - dependency-name: sqlmodel
        versions: [">=0.0.45"]

  # Frontend (frontend/package.json)
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend

  # Push-agent (agent/go.mod)
  - package-ecosystem: gomod
    directory: /agent
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - agent

  # CI workflow actions (.github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # Base images (Dockerfile), pinned by digest so a rebuilt upstream image
  # arrives as a PR rather than silently at the next build.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
