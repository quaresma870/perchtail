name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Format check (black)
        run: black --check backend

      - name: Migrations apply cleanly
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Test
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check + e2e specs)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Not the sandboxed Chromium some contributors' dev containers
      # pre-install (see playwright.config.ts) -- CI always fetches its own.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # sshd/smbd's own logs (backend/scripts/setup_e2e_test_servers.sh) --
      # separate from the Playwright report above, useful when a real
      # protocol source spec fails at the connection level rather than in
      # the UI.
      - name: Upload e2e test server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-server-logs
          path: |
            backend/data/e2e/ssh-etc/sshd.log
            backend/data/e2e/smb-etc/log.smbd
          if-no-files-found: ignore
          retention-days: 7

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum

      - name: Vet
        run: go vet ./...

      - name: Format check (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -v

      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/perchtail-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/perchtail-agent-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/perchtail-agent-windows-amd64.exe .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perchtail-agent-binaries
          path: agent/dist/

      # govulncheck-action installs golang.org/x/vuln@latest, which now
      # requires Go >= 1.25 to build -- independent of agent/go.mod's own
      # "go 1.24.7" directive (used for the build/vet/test steps above).
      # A 1.25 toolchain here only runs the govulncheck tool itself; it
      # doesn't change what Go version the agent binaries are built for.
      - name: Dependency vulnerability scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
          work-dir: agent

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false, load: true -- built into the runner's local Docker
      # daemon only, so Trivy below can scan it. Nothing is published to a
      # registry here; that's a separate concern for when a release
      # pipeline exists.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: perchtail:ci

      # Blocking, same as the dependency scans above -- HIGH/CRITICAL in the
      # published base image + OS packages is exactly the kind of thing that
      # should stop a merge, not just get noted somewhere.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: perchtail:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # SBOM as a build artifact for now, not yet attached to a GitHub
      # Release -- there's no release-publishing workflow in this repo yet
      # (see ROADMAP.md), so "alongside releases" is a follow-up once one
      # exists rather than invented here.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: perchtail:ci
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: perchtail-sbom
          path: sbom.cyclonedx.json
