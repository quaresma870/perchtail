name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job only reads the repo and uploads build artifacts, so the
# GITHUB_TOKEN gets read access to contents and nothing else.
permissions:
  contents: read

env:
  # The last published release, pinned by digest, that the upgrade test in
  # the docker-image job upgrades from. Update it at every release (see
  # CONTRIBUTING.md, "Releasing"): docker buildx imagetools inspect
  # ghcr.io/quaresma870/perchtail:X.Y.Z prints the digest.
  PREVIOUS_RELEASE_IMAGE: ghcr.io/quaresma870/perchtail:0.7.1@sha256:1cbee9306b308bdcbfb1cd4a5e2caa6dee3da74663f17228b0eae6a34ed74bf2

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Format check (black)
        run: black --check backend

      - name: Migrations apply cleanly
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Test
        run: pytest -v

      # The load-test kit (loadtest/) is standard-library Python: lint it
      # and run its unit tests here, so it can't drift from the API.
      - name: Load-test kit (lint and unit tests)
        run: |
          ruff check loadtest
          python -m unittest discover -s loadtest/tests

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

      - name: Static security analysis (Bandit)
        run: |
          pip install bandit==1.9.4
          bandit -q -r backend/app

  # The backend suite again on PostgreSQL (#306): TEST_DATABASE_URL points the
  # tests at a throwaway PostgreSQL 18 service, reachable only inside the
  # runner. It has a password, a fixed test value, because the tests check
  # that a database password never reaches the logs or an error.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        env:
          POSTGRES_USER: perchtail_test
          POSTGRES_DB: perchtail_test
          POSTGRES_PASSWORD: perchtail_test
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perchtail_test -d perchtail_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://perchtail_test:perchtail_test@127.0.0.1:5432/perchtail_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Test on PostgreSQL
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check + e2e specs)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      # High and critical advisories fail, except the ones listed with a
      # reason and an expiry date in .github/npm-audit-exceptions.json.
      - name: Dependency vulnerability scan (npm audit)
        run: python3 ../.github/scripts/npm_audit.py --level high .

  e2e:
    runs-on: ubuntu-latest
    # A normal run takes 3-5 minutes. A slow apt mirror once stretched the
    # Playwright and test-server installs to 16; past 30, something is
    # stuck, and without this the job would hold the PR for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Not the sandboxed Chromium some contributors' dev containers
      # pre-install (see playwright.config.ts) -- CI always fetches its own.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Installed as its own step, so a slow apt mirror doesn't eat into
      # Playwright's webServer start-up timeout (it did, twice; the
      # setup script skips apt when sshd and smbd are already there).
      - name: Install SSH/SMB test servers
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: "1"
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq openssh-server samba samba-common-bin

      - name: E2E tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # sshd/smbd's own logs (backend/scripts/setup_e2e_test_servers.sh) --
      # separate from the Playwright report above, useful when a real
      # protocol source spec fails at the connection level rather than in
      # the UI.
      - name: Upload e2e test server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-server-logs
          path: |
            backend/data/e2e/ssh-etc/sshd.log
            backend/data/e2e/smb-etc/log.smbd
          if-no-files-found: ignore
          retention-days: 7

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: agent/go.sum

      - name: Vet
        run: go vet ./...

      - name: Format check (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -v

      # Path containment (internal/agent/fuzz_test.go): `go test` above only
      # runs the seed corpus; this explores new inputs for a short while.
      - name: Fuzz the path checks
        run: |
          for target in FuzzIsSafeRelativePath FuzzFetchStaysInBase; do
            go test ./internal/agent -run '^$' -fuzz "^${target}\$" -fuzztime 30s
          done

      # Redaction engine (internal/redact/fuzz_test.go): no input may panic,
      # the output must not depend on how the input is cut into blocks, and
      # a custom rule never leaves its secret in the clear.
      - name: Fuzz the redaction engine
        run: |
          for target in FuzzRedactBlockCuts FuzzRedactUTF16 FuzzRedactWindow FuzzCustomRule; do
            go test ./internal/redact -run '^$' -fuzz "^${target}\$" -fuzztime 30s
          done

      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/perchtail-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/perchtail-agent-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/perchtail-agent-windows-amd64.exe .

      - name: Static security analysis (gosec)
        working-directory: agent
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perchtail-agent-binaries
          path: agent/dist/

      # The same Go release the agent is built with (above and in the release
      # workflow), so the standard library it checks is the one in the
      # binaries. Keep the three in step.
      - name: Dependency vulnerability scan (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.27"
          check-latest: true
          work-dir: agent

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # push: false, load: true -- built into the runner's local Docker
      # daemon only, so Trivy below can scan it. Publishing to ghcr.io is
      # done by .github/workflows/release.yml when a release is published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: perchtail:ci

      # For the kubernetes job, which installs the Helm chart with this image.
      - name: Save the image for the Kubernetes test
        run: docker save perchtail:ci | gzip > "$RUNNER_TEMP/perchtail-ci.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perchtail-ci-image
          path: ${{ runner.temp }}/perchtail-ci.tar.gz
          retention-days: 1

      # Blocking, same as the dependency scans above -- HIGH/CRITICAL in the
      # published base image + OS packages is exactly the kind of thing that
      # should stop a merge, not just get noted somewhere.
      # Pinned to a release, never a branch: in March 2026 this action's
      # tags were force-pushed to credential-stealing code; v0.35.0 is the
      # first release published after that cleanup.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: perchtail:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # Dynamic scan of the running image (OWASP ZAP baseline): ZAP crawls
      # the app as an anonymous visitor and checks every response for
      # missing security headers, cookie flags, error and information
      # disclosure. The rules in .zap/rules.tsv marked FAIL stop the merge;
      # the rest is reported in the artifact. The instance runs with the
      # production defaults (Secure cookies included) and throwaway secrets.
      - name: Start the image for the ZAP scan
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32)"
          docker run -d --name perchtail -p 127.0.0.1:8080:8000 \
            -e CREDENTIAL_ENCRYPTION_KEY="$key" \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8080 \
            -e UPDATE_CHECK=false \
            perchtail:ci
          for _ in $(seq 1 60); do
            if docker exec perchtail python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')" 2>/dev/null; then
              echo "PerchTail is up"; exit 0
            fi
            sleep 2
          done
          docker logs perchtail | tail -50
          exit 1

      # The ZAP image is pinned by digest (2.17.0). Exit code 1 means a FAIL
      # rule matched; warnings (2) don't fail the job (-I).
      - name: Scan the running image (OWASP ZAP baseline)
        run: |
          set -euo pipefail
          mkdir -p zap && chmod 777 zap
          cp .zap/rules.tsv zap/rules.tsv
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://127.0.0.1:8080 -c rules.tsv -I -j \
              -r zap-report.html -J zap-report.json -w zap-report.md

      - name: Upload the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-report
          path: zap/zap-report.*
          if-no-files-found: ignore

      - name: Stop the image
        if: always()
        run: docker rm -f perchtail >/dev/null 2>&1 || true

      # Upgrade test: the previous release (PREVIOUS_RELEASE_IMAGE) is filled
      # through its API by .github/upgrade-test/seed.py, stopped, and
      # perchtail:ci starts on the same volume; verify.py then checks that
      # the migrations reached the head and that every object, secret and
      # audit entry came through, but for the differences the CHANGELOG
      # announces, and that the previous release refuses the upgraded
      # database. Both versions get the same throwaway key.
      - name: "Upgrade test: start the previous release"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upgrade-test/report"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          printf '%s\n' "CREDENTIAL_ENCRYPTION_KEY=$key" \
            PUBLIC_BASE_URL=http://127.0.0.1:8081 SESSION_COOKIE_SECURE=false \
            UPDATE_CHECK=false LOCAL_SOURCE_ROOTS=/data/logs > "$RUNNER_TEMP/upgrade-test/env"
          docker volume create perchtail-upgrade >/dev/null
          docker run -d --name perchtail-previous -p 127.0.0.1:8081:8000 \
            --env-file "$RUNNER_TEMP/upgrade-test/env" -v perchtail-upgrade:/data \
            "$PREVIOUS_RELEASE_IMAGE"
          .github/upgrade-test/wait-healthy.sh perchtail-previous

      # The first super admin's temporary password: in DATA_DIR from 0.7.0
      # on, in the log before.
      - name: "Upgrade test: fill the previous release"
        run: |
          set -euo pipefail
          { docker exec perchtail-previous cat /data/db/initial-admin-password 2>/dev/null \
              || docker logs perchtail-previous 2>&1; } \
            | python3 .github/upgrade-test/seed.py --base-url http://127.0.0.1:8081 \
                --out "$RUNNER_TEMP/upgrade-test/report/before.json" \
                --secrets "$RUNNER_TEMP/upgrade-test/secrets.json"

      - name: "Upgrade test: upgrade to this build"
        run: |
          set -euo pipefail
          docker stop perchtail-previous
          docker run -d --name perchtail-new -p 127.0.0.1:8081:8000 \
            --env-file "$RUNNER_TEMP/upgrade-test/env" -v perchtail-upgrade:/data \
            perchtail:ci
          .github/upgrade-test/wait-healthy.sh perchtail-new

      - name: "Upgrade test: verify the upgraded install"
        run: |
          python3 .github/upgrade-test/verify.py --base-url http://127.0.0.1:8081 \
            --container perchtail-new \
            --before "$RUNNER_TEMP/upgrade-test/report/before.json" \
            --secrets "$RUNNER_TEMP/upgrade-test/secrets.json" \
            --out "$RUNNER_TEMP/upgrade-test/report/after.json"

      # The previous release must refuse the upgraded database at startup
      # and leave it as it was, unless no migration came after it (the
      # database is then at a revision it knows, and verify.py says so): the
      # new build then passes verify.py again.
      - name: "Upgrade test: the previous release refuses the upgraded database"
        run: |
          set -euo pipefail
          docker stop perchtail-new
          python3 .github/upgrade-test/verify.py downgrade --volume perchtail-upgrade \
            --previous-image "$PREVIOUS_RELEASE_IMAGE" --new-image perchtail:ci \
            --env-file "$RUNNER_TEMP/upgrade-test/env" \
            --log "$RUNNER_TEMP/upgrade-test/report/downgrade.log"
          docker start perchtail-new
          .github/upgrade-test/wait-healthy.sh perchtail-new
          python3 .github/upgrade-test/verify.py --base-url http://127.0.0.1:8081 \
            --container perchtail-new \
            --before "$RUNNER_TEMP/upgrade-test/report/before.json" \
            --secrets "$RUNNER_TEMP/upgrade-test/secrets.json" \
            --out "$RUNNER_TEMP/upgrade-test/report/after-downgrade-attempt.json"

      - name: "Upgrade test: collect the container logs"
        if: failure()
        run: |
          for c in perchtail-previous perchtail-new; do
            docker logs "$c" > "$RUNNER_TEMP/upgrade-test/report/$c.log" 2>&1 || true
          done

      # The report holds the JSON snapshots and logs, never secrets.json.
      - name: "Upgrade test: upload the report"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-test-report
          path: ${{ runner.temp }}/upgrade-test/report/
          if-no-files-found: ignore

      - name: "Upgrade test: clean up"
        if: always()
        run: |
          docker rm -f perchtail-previous perchtail-new perchtail-downgrade >/dev/null 2>&1 || true
          docker volume rm perchtail-upgrade >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/upgrade-test"

      # SBOM as a build artifact of every CI run. Releases get their own,
      # for the published multi-arch image (.github/workflows/release.yml).
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: perchtail:ci
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perchtail-sbom
          path: sbom.cyclonedx.json

  kubernetes:
    # The Helm chart (charts/perchtail): lint, the rendered objects checked
    # against the oldest Kubernetes it supports and the current one, then
    # installed on a kind cluster with the image the docker-image job built:
    # the sign-in page through a port-forward, a sign-in with the first super
    # admin's temporary password, and a `helm upgrade` that keeps the data.
    needs: docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0

      # The chart carries the app's version (CONTRIBUTING.md, releases, step 1):
      # a chart left behind would install an older image on a newer database.
      - name: The chart's version is the app's
        run: |
          set -euo pipefail
          app="$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('backend/app/version.py').read()).group(1))")"
          chart="$(sed -n 's/^version: *//p' charts/perchtail/Chart.yaml)"
          appversion="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/perchtail/Chart.yaml)"
          echo "app $app, chart $chart, appVersion $appversion"
          test "$chart" = "$app" && test "$appversion" = "$app"

      - name: Lint the chart and validate what it renders (kubeconform)
        run: |
          set -euo pipefail
          helm lint --strict charts/perchtail --set credentialEncryptionKey.existingSecret=perchtail-key
          helm lint --strict charts/perchtail -f charts/perchtail/ci/full-values.yaml
          for version in 1.29.0 1.36.0; do
            helm template perchtail charts/perchtail -f charts/perchtail/ci/full-values.yaml \
                --kube-version "$version" \
              | docker run --rm -i \
                  ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
                  -strict -summary -kubernetes-version "$version" -
          done
          # Without a key, the chart refuses to render, saying how to make one.
          if helm template perchtail charts/perchtail > /dev/null 2> "$RUNNER_TEMP/no-key.txt"; then
            echo "the chart rendered without a key"; exit 1
          fi
          grep -q "kubectl create secret generic perchtail-key" "$RUNNER_TEMP/no-key.txt"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perchtail-ci-image
          path: ${{ runner.temp }}

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: perchtail

      - name: Load the image into the cluster
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/perchtail-ci.tar.gz" | docker load
          kind load docker-image perchtail:ci --name perchtail

      - name: Install the chart
        run: |
          set -euo pipefail
          kubectl create namespace perchtail
          kubectl -n perchtail create secret generic perchtail-key \
            --from-literal=credential-encryption-key="$(openssl rand -base64 32)"
          # A values file of its own, used again at the upgrade, as
          # docs/kubernetes.md says (not --reuse-values).
          cat > "$RUNNER_TEMP/values.yaml" <<'VALUES'
          credentialEncryptionKey: { existingSecret: perchtail-key }
          image: { registry: "", repository: perchtail, tag: ci, pullPolicy: Never }
          persistence: { size: 1Gi }
          env:
            SESSION_COOKIE_SECURE: "false"
            UPDATE_CHECK: "false"
          VALUES
          helm install perchtail charts/perchtail -n perchtail --wait --timeout 5m \
            -f "$RUNNER_TEMP/values.yaml"
          kubectl -n perchtail get pods,pvc
          # A clean start: no warning or error in the log, but the one that
          # says where the first admin's temporary password is.
          if kubectl -n perchtail logs deploy/perchtail \
              | grep -E '"level": "(warning|error|critical)"' \
              | grep -v initial_super_admin.seeded; then
            echo "the pod started with warnings or errors"; exit 1
          fi

      # Plain HTTP through the port-forward, hence SESSION_COOKIE_SECURE=false.
      - name: Sign in, upgrade the release, and sign in again
        run: |
          set -euo pipefail
          forward() {
            kubectl -n perchtail port-forward svc/perchtail 8080:80 > "$RUNNER_TEMP/forward.log" 2>&1 &
            for _ in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:8080/ && return 0
              sleep 1
            done
            cat "$RUNNER_TEMP/forward.log"; return 1
          }
          login() {
            curl -sS -c "$RUNNER_TEMP/jar" -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d "{\"username\": \"admin\", \"password\": \"$1\"}" http://127.0.0.1:8080/auth/login
          }
          forward
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>PerchTail</title>'
          echo "the sign-in page answers"
          temporary="$(kubectl -n perchtail exec deploy/perchtail -- cat /data/db/initial-admin-password)"
          echo "::add-mask::$temporary"
          test "$(login "$temporary")" = 200
          python3 -c "import json, sys; assert json.load(open(sys.argv[1]))['must_change_password'] is True" \
            "$RUNNER_TEMP/login.json"
          echo "signed in with the temporary password"
          password="Kind$(openssl rand -hex 16)#9"
          echo "::add-mask::$password"
          curl -fsS -b "$RUNNER_TEMP/jar" -o /dev/null -H 'Content-Type: application/json' \
            -d "{\"current_password\": \"$temporary\", \"new_password\": \"$password\"}" \
            http://127.0.0.1:8080/auth/change-password
          kill %1 || true

          helm upgrade perchtail charts/perchtail -n perchtail --wait --timeout 5m \
            -f "$RUNNER_TEMP/values.yaml" --set env.LOG_LEVEL=DEBUG
          test "$(kubectl -n perchtail exec deploy/perchtail -- printenv LOG_LEVEL)" = DEBUG
          echo "the upgrade changed the pod's environment"
          forward
          test "$(login "$password")" = 200
          python3 -c "import json, sys; assert json.load(open(sys.argv[1]))['must_change_password'] is False" \
            "$RUNNER_TEMP/login.json"
          echo "after the upgrade, the account and its new password are still there"

      - name: Show the pod on failure
        if: failure()
        run: |
          kubectl -n perchtail get all,pvc || true
          kubectl -n perchtail describe pods || true
          kubectl -n perchtail logs deploy/perchtail --all-containers --tail=200 || true

  workflows:
    # Audits the workflows themselves: template injection, credentials left
    # in checkouts, cache poisoning in release builds, unpinned actions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit the workflows (zizmor)
        run: |
          pip install zizmor==1.32.0
          zizmor --offline --min-severity low .github/workflows/
      - name: Test the CI scripts
        run: python3 -m unittest discover -s .github/scripts/tests -v
