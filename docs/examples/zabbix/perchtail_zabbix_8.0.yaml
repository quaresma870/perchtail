                - $.scratch.used_bytes
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: storage
        - uuid: 2956b70348014929a3e734be325b18f7
          name: 'PerchTail: Scratch used, in %'
          type: DEPENDENT
          key: perchtail.scratch.pused
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Share of SCRATCH_MAX_GB in use.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scratch.used_fraction
            - type: MULTIPLIER
              parameters:
                - '100'
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: 04737d2707314d0bb1d07937187b6d47
              expression: 'min(/PerchTail by HTTP/perchtail.scratch.pused,5m)>{$PERCHTAIL.SCRATCH.PUSED.MAX.WARN}'
              name: 'PerchTail: Scratch space is filling up (over {$PERCHTAIL.SCRATCH.PUSED.MAX.WARN}%)'
              priority: WARNING
              tags:
                - tag: scope
                  value: capacity
        - uuid: 0640cedb8b4349e093d4c69475339c58
