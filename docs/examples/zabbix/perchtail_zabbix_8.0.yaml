zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 3cd9bd53761b4664a31d55e784dc8b68
      template: 'PerchTail by HTTP'
      name: 'PerchTail by HTTP'
      description: |
        Monitors PerchTail through GET /monitoring/health: one HTTP agent item reads the whole report, dependent items pick the fields with JSONPath, and low-level discovery creates items and a trigger for each background job.

        Setup: generate a monitoring token in PerchTail (Settings -> System -> Monitoring), link this template to a host, and set {$PERCHTAIL.URL} (no trailing slash) and {$PERCHTAIL.TOKEN} on the host.

        See docs/monitoring.md in the PerchTail repository for every field and when the status degrades.
      groups:
        - name: Templates/Applications
      items:
        - uuid: a608ab5784d8494b87f0e5e71b9120da
          name: 'PerchTail: Get health report'
          type: HTTP_AGENT
          key: perchtail.health.get
          delay: '{$PERCHTAIL.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 10s
          url: '{$PERCHTAIL.URL}/monitoring/health'
          headers:
            - name: Authorization
              value: 'Bearer {$PERCHTAIL.TOKEN}'
          description: 'The whole /monitoring/health report. Not stored: the dependent items keep what matters.'
          tags:
            - tag: component
              value: raw
        - uuid: 3a844ea2ce2744118624df53b2d019f8
          name: 'PerchTail: Status'
          type: DEPENDENT
          key: perchtail.status
          delay: '0'
          description: 'Overall status: ok, degraded (something needs a look) or error (the database is unreachable).'
          valuemap:
            name: 'PerchTail status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var codes = {ok: 0, degraded: 1, error: 2};
                  return codes.hasOwnProperty(value) ? codes[value] : 3;
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 75f4027a38aa43c9b2a07fe948ff4432
              expression: 'last(/PerchTail by HTTP/perchtail.status)=2'
              name: 'PerchTail: Status is error'
              priority: HIGH
              description: 'The database is unreachable.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 18adee2a4ec74444a0f1e088067f3668
              expression: 'last(/PerchTail by HTTP/perchtail.status)=1'
              name: 'PerchTail: Status is degraded'
              priority: WARNING
              description: 'See docs/monitoring.md for what makes the status degraded; the other PerchTail triggers usually name the cause.'
              tags:
                - tag: scope
                  value: performance
        - uuid: f29f5d16ea3748a2924cc95055458876
          name: 'PerchTail: Version'
          type: DEPENDENT
          key: perchtail.version
          delay: '0'
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 5d23fd2c91634216bb68da7b2c208950
              expression: 'last(/PerchTail by HTTP/perchtail.version,#1)<>last(/PerchTail by HTTP/perchtail.version,#2) and length(last(/PerchTail by HTTP/perchtail.version))>0'
              name: 'PerchTail: Version has changed'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 32a5a0616f6c4ed29beecc83f2ac846c
          name: 'PerchTail: Instance'
          type: DEPENDENT
          key: perchtail.instance.hostname
          delay: '0'
          trends: '0'
          value_type: CHAR
          description: 'Hostname of the process that answered.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.instance.hostname
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: application
        - uuid: 18b2e25508694f4b909a4a5ba0299e12
          name: 'PerchTail: Uptime'
          type: DEPENDENT
          key: perchtail.uptime
          delay: '0'
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime_seconds
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 2672a4ec6e884277b88c33e0cd84e222
              expression: 'nodata(/PerchTail by HTTP/perchtail.uptime,{$PERCHTAIL.NODATA.TIMEOUT})=1'
              name: 'PerchTail: Health endpoint is not answering'
              priority: AVERAGE
              description: 'No health report for {$PERCHTAIL.NODATA.TIMEOUT}: PerchTail is down, the URL or token is wrong (401 or 503), or something in between blocks it. The "Get health report" item shows the error.'
              tags:
                - tag: scope
                  value: availability
            - uuid: c3a4ca1a9b90424182e90c3230b1a53c
              expression: 'last(/PerchTail by HTTP/perchtail.uptime)<10m'
              name: 'PerchTail: Has been restarted'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: f43c4686633444be9e91a01b2fcae170
          name: 'PerchTail: Database reachable'
          type: DEPENDENT
          key: perchtail.db.reachable
          delay: '0'
          valuemap:
            name: 'PerchTail yes/no'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.database.reachable
            - type: JAVASCRIPT
              parameters:
                - 'return value === ''true'' ? 1 : 0;'
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: database
          triggers:
            - uuid: e78c2059bacd49a893168fc6f61ca940
              expression: 'last(/PerchTail by HTTP/perchtail.db.reachable)=0'
              name: 'PerchTail: Database is unreachable'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 40f21ee1f38b480ba47bba6f3c8bbbb4
          name: 'PerchTail: Database latency'
          type: DEPENDENT
          key: perchtail.db.latency
          delay: '0'
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.database.latency_ms
              error_handler: DISCARD_VALUE
            - type: NOT_MATCHES_REGEX
              parameters:
                - ^null$
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: database
        - uuid: 4f778c7afa704e67a3876bf6ca53e2d6
          name: 'PerchTail: Database file size'
          type: DEPENDENT
          key: perchtail.db.size
          delay: '0'
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.database.size_bytes
              error_handler: DISCARD_VALUE
            - type: NOT_MATCHES_REGEX
              parameters:
                - ^null$
              error_handler: DISCARD_VALUE
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: database
        - uuid: 31bdf08b5ea94d3e95bf8d6f1da515e0
          name: 'PerchTail: Database WAL size'
          type: DEPENDENT
          key: perchtail.db.wal_size
          delay: '0'
          units: B
          description: 'Normally cut back by the hourly WAL checkpoint job.'
          preprocessing:
            - type: JSONPATH
              parameters:
