              name: 'PerchTail: Webhook calls keep failing'
              priority: WARNING
              description: 'Some alert webhook calls have been waiting to be retried for 15 minutes.'
              tags:
                - tag: scope
                  value: notice
        - uuid: c7d5631607c74d63854b248d4cbfb158
          name: 'PerchTail: Webhook calls given up'
          type: DEPENDENT
          key: perchtail.alerts.failed
          delay: '0'
          description: 'Webhook calls given up on after an hour of retries, across all alerts.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alerts.failed_deliveries
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: alerts
          triggers:
            - uuid: f75e055c445f4ed4897039e2598bf48c
              expression: 'change(/PerchTail by HTTP/perchtail.alerts.failed)>0'
              name: 'PerchTail: Webhook calls were given up on'
              priority: WARNING
              manual_close: 'YES'
              description: 'The Alerts page shows which alert and its last error.'
              tags:
                - tag: scope
                  value: notice
        - uuid: e00f00e6dff24351883da37a17163bcf
          name: 'PerchTail: Scheduler running'
          type: DEPENDENT
          key: perchtail.scheduler.running
          delay: '0'
          valuemap:
            name: 'PerchTail yes/no'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scheduler.running
            - type: JAVASCRIPT
              parameters:
                - 'return value === ''true'' ? 1 : 0;'
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: jobs
          triggers:
            - uuid: 680628544bc944a994dfc61c050ff872
              expression: 'last(/PerchTail by HTTP/perchtail.scheduler.running)=0'
              name: 'PerchTail: Background job scheduler is not running'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 9834cbb5324540c4aee8a0bf8c271753
          name: 'PerchTail: Jobs failed'
          type: DEPENDENT
          key: perchtail.jobs.failed
          delay: '0'
          description: 'Background jobs whose last run failed. Each job has its own trigger (discovery).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scheduler.failed_jobs
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: jobs
        - uuid: 2372be1d0de3416c8de6b4d385669210
          name: 'PerchTail: Audit log integrity'
          type: DEPENDENT
          key: perchtail.audit.integrity
          delay: '0'
          description: 'Result of the last audit hash-chain check.'
          valuemap:
            name: 'PerchTail audit integrity'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.audit_integrity.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var codes = {ok: 0, broken: 1, race_breaks: 2, unknown: 3};
                  return codes.hasOwnProperty(value) ? codes[value] : 3;
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 6fb2b96bb17e48d5aabcc162a16c7c84
              expression: 'last(/PerchTail by HTTP/perchtail.audit.integrity)=1'
              name: 'PerchTail: Audit log hash chain is broken'
              priority: HIGH
              description: 'The audit log was changed outside PerchTail. The Audit Log page shows the first broken row.'
              tags:
                - tag: scope
                  value: security
            - uuid: d453bc08098f45f7bf9289efb30010b3
              expression: 'last(/PerchTail by HTTP/perchtail.audit.integrity)=2'
              name: 'PerchTail: Audit log has unrecorded race breaks'
              priority: INFO
              description: 'Breaks left by the 0.5.x race, waiting for a super admin to record them on the Audit Log page.'
              tags:
                - tag: scope
                  value: notice
        - uuid: a7ee5ba4601348ecb023dd40553474de
          name: 'PerchTail: Logs deleted early by the size limit'
          type: DEPENDENT
          key: perchtail.logs.deleted_early
          delay: '0'
          valuemap:
            name: 'PerchTail yes/no'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.logs.size_limit_deleted_early
            - type: JAVASCRIPT
              parameters:
                - 'return value === ''true'' ? 1 : 0;'
          master_item:
            key: perchtail.health.get
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: 15175b13557e490181b9b5e7762f79c7
              expression: 'last(/PerchTail by HTTP/perchtail.logs.deleted_early)=1'
              name: 'PerchTail: Own logs are deleted before their retention'
              priority: INFO
              description: 'LOG_MAX_TOTAL_MB deleted logs that LOG_RETENTION_DAYS would still have kept: lower the log level or give the logs more space.'
              tags:
                - tag: scope
                  value: capacity
      discovery_rules:
        - uuid: 8c3735cc98014e338ca84b5d8adce024
          name: 'Background jobs discovery'
          type: DEPENDENT
          key: perchtail.jobs.discovery
          delay: '0'
          description: 'One set of items per background job in the health report.'
          item_prototypes:
            - uuid: 080d895b66e047d4a3ef1d7d66a8b353
              name: 'PerchTail job {#JOB.NAME}: Last run OK'
              type: DEPENDENT
              key: 'perchtail.job.last_ok[{#JOB.ID}]'
              delay: '0'
              valuemap:
                name: 'PerchTail yes/no'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.scheduler.jobs[?(@.id=='{#JOB.ID}')].last_ok.first()"
                  error_handler: DISCARD_VALUE
                - type: NOT_MATCHES_REGEX
                  parameters:
                    - ^null$
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - 'return value === ''true'' ? 1 : 0;'
              master_item:
                key: perchtail.health.get
              tags:
                - tag: component
                  value: jobs
                - tag: job
                  value: '{#JOB.ID}'
              trigger_prototypes:
                - uuid: 02cb64b88cf24e70bf348dc0a751b2c6
                  expression: 'last(/PerchTail by HTTP/perchtail.job.last_ok[{#JOB.ID}])=0'
                  name: 'PerchTail: Job "{#JOB.NAME}" failed its last run'
                  priority: WARNING
                  description: 'The last_error of the job in /monitoring/health says why. The trigger clears when a run works again.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 1428002c84fc487d9c5b41129cf87a36
              name: 'PerchTail job {#JOB.NAME}: Time since last success'
              type: DEPENDENT
              key: 'perchtail.job.last_success_age[{#JOB.ID}]'
              delay: '0'
              value_type: FLOAT
              units: s
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.scheduler.jobs[?(@.id=='{#JOB.ID}')].last_success_age_seconds.first()"
                  error_handler: DISCARD_VALUE
                - type: NOT_MATCHES_REGEX
                  parameters:
                    - ^null$
                  error_handler: DISCARD_VALUE
              master_item:
                key: perchtail.health.get
              tags:
                - tag: component
                  value: jobs
                - tag: job
                  value: '{#JOB.ID}'
            - uuid: f28daeb75e3c4c57aab257971c5daae4
              name: 'PerchTail job {#JOB.NAME}: Last run duration'
              type: DEPENDENT
              key: 'perchtail.job.last_duration[{#JOB.ID}]'
              delay: '0'
              value_type: FLOAT
              units: s
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.scheduler.jobs[?(@.id=='{#JOB.ID}')].last_duration_ms.first()"
                  error_handler: DISCARD_VALUE
                - type: NOT_MATCHES_REGEX
                  parameters:
                    - ^null$
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: perchtail.health.get
              tags:
                - tag: component
                  value: jobs
                - tag: job
                  value: '{#JOB.ID}'
          master_item:
            key: perchtail.health.get
          lld_macro_paths:
            - lld_macro: '{#JOB.ID}'
              path: $.id
            - lld_macro: '{#JOB.NAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scheduler.jobs
      tags:
        - tag: class
          value: application
        - tag: target
          value: perchtail
      macros:
        - macro: '{$PERCHTAIL.URL}'
          value: 'https://perchtail.example.com'
          description: 'PerchTail base URL, without a trailing slash.'
        - macro: '{$PERCHTAIL.TOKEN}'
          type: SECRET_TEXT
          description: 'Monitoring token from Settings -> System -> Monitoring in PerchTail.'
        - macro: '{$PERCHTAIL.INTERVAL}'
          value: 1m
          description: 'How often the health report is read.'
        - macro: '{$PERCHTAIL.NODATA.TIMEOUT}'
          value: 5m
          description: 'No report for this long fires "Health endpoint is not answering".'
        - macro: '{$PERCHTAIL.DISK.PFREE.MIN.WARN}'
          value: '15'
          description: 'Free space, in %, below which the data, scratch or log filesystem warns.'
        - macro: '{$PERCHTAIL.DISK.PFREE.MIN.CRIT}'
          value: '5'
          description: 'Free space, in %, below which the data, scratch or log filesystem is critical (PerchTail reports degraded from 5%).'
        - macro: '{$PERCHTAIL.SCRATCH.PUSED.MAX.WARN}'
          value: '85'
          description: 'Scratch use, in % of SCRATCH_MAX_GB, above which it warns (PerchTail reports degraded from 90%).'
        - macro: '{$PERCHTAIL.NAME_INDEX.AGE.MAX}'
          value: '3600'
          description: 'Seconds the oldest file-name index pass may reach. Keep it well above the index interval in Settings -> System (15 minutes by default).'
        - macro: '{$PERCHTAIL.SOURCES.FAILING.MAX}'
          value: '0'
          description: 'Sources allowed to fail their check before the trigger fires.'
      valuemaps:
        - uuid: 68303e267fcd49768d1242e055ec62ca
          name: 'PerchTail audit integrity'
          mappings:
            - value: '0'
              newvalue: ok
            - value: '1'
              newvalue: broken
            - value: '2'
              newvalue: 'race breaks unrecorded'
            - value: '3'
              newvalue: unknown
        - uuid: e5c9c92c831346939854784dd8a875ad
          name: 'PerchTail status'
          mappings:
            - value: '0'
              newvalue: ok
            - value: '1'
              newvalue: degraded
            - value: '2'
              newvalue: error
            - value: '3'
              newvalue: unknown
        - uuid: e71362f8ec684d579a2176519292d773
          name: 'PerchTail yes/no'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
  triggers:
    - uuid: c98286cff6ff416f84bbc9915672f978
      expression: 'max(/PerchTail by HTTP/perchtail.agents.connected,5m)<last(/PerchTail by HTTP/perchtail.agents.configured)'
      name: 'PerchTail: Push agents are disconnected'
      priority: WARNING
      description: 'Fewer agents have been connected for 5 minutes than there are enabled agent sources. Settings -> Sources shows which agent sources are offline.'
      tags:
        - tag: scope
          value: availability
