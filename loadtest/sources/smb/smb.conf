[global]
workgroup = WORKGROUP
server role = standalone server
security = user
# smbprotocol (PerchTail's SMB client) has no Kerberos to negotiate with.
ntlm auth = yes
map to guest = never
smb ports = 445
log level = 1
logging = stdout
load printers = no
printcap name = /dev/null
disable spoolss = yes

[ltlogs]
path = /srv/logs
read only = yes
browsable = yes
guest ok = no
