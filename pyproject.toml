[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "backend/migrations/versions"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/app", "backend/tests"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-defaults is the idiomatic DI pattern, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
